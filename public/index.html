<script>
function safeArray(arr){ 
  return Array.isArray(arr) ? arr : []; 
}

function safeObj(obj){ 
  return obj && typeof obj === "object" ? obj : {}; 
}

function renderList(items){
  const arr = safeArray(items);
  if(!arr.length) return "<li>No data returned.</li>";

  return arr.map(i => {
    if(typeof i === "string") return `<li>${i}</li>`;
    return `<li>${i.issue || i.cause || i.action || i.sop || i.kpi || i.details || JSON.stringify(i)}</li>`;
  }).join("");
}

async function runDiagnosis(){
  const problem = document.getElementById("problem").value.trim();
  const industry = document.getElementById("industry").value;
  const output = document.getElementById("output");

  if(problem.length < 20){
    alert("Please describe the operational issue in more detail.");
    return;
  }

  output.innerHTML = `
    <div class="output-card">
      <p class="loading">FLOW is analyzing your operations...</p>
    </div>
  `;

  try{
    const response = await fetch("/api/diagnose", {
      method:"POST",
      headers:{ 
        "Content-Type":"application/json" 
      },
      body:JSON.stringify({ 
        industry, 
        problem 
      })
    });

    const text = await response.text();

    let data;
    try {
      data = JSON.parse(text);
    } catch (e) {
      console.error("Raw response:", text);
      throw new Error("Invalid JSON from backend");
    }

    if(!response.ok || data.error){
      throw new Error(data.error || "Backend error");
    }

    const systemBreakdown = safeObj(data.systemBreakdown);
    const flow = safeObj(data.flowFramework);

    output.innerHTML = `
      <div class="output-card">
        <h4>Executive Summary</h4>
        <p>${data.executiveSummary || data.problemSummary || "No summary returned."}</p>
      </div>

      <div class="output-card">
        <h4>Core Problem</h4>
        <p>${data.coreProblem || "No core problem returned."}</p>
      </div>

      <div class="output-card">
        <h4>Root Causes</h4>
        <ul>${renderList(data.rootCauses)}</ul>
      </div>

      <div class="output-card">
        <h4>System Breakdown</h4>
        <p><strong>People:</strong> ${safeArray(systemBreakdown.people).join(", ") || "—"}</p>
        <p><strong>Process:</strong> ${safeArray(systemBreakdown.process).join(", ") || "—"}</p>
        <p><strong>Systems:</strong> ${safeArray(systemBreakdown.systems).join(", ") || "—"}</p>
      </div>

      <div class="output-card">
        <h4>FLOW Framework</h4>
        <p><strong>Find:</strong> ${flow.find || "—"}</p>
        <p><strong>Layout:</strong> ${flow.layout || "—"}</p>
        <p><strong>Optimize:</strong> ${flow.optimize || "—"}</p>
        <p><strong>Work:</strong> ${flow.work || "—"}</p>
      </div>

      <div class="output-card">
        <h4>Priority / Recommended Actions</h4>
        <ul>${renderList(data.priorityActions || data.recommendedActions)}</ul>
      </div>

      <div class="output-card">
        <h4>SOP Suggestions</h4>
        <ul>${renderList(data.sopSuggestions)}</ul>
      </div>

      <div class="output-card">
        <h4>KPI Suggestions</h4>
        <ul>${renderList(data.kpis || data.kpiSuggestions)}</ul>
      </div>

      <div class="output-card">
        <h4>Expected Outcome</h4>
        <p>${data.expectedOutcome || "No outcome returned."}</p>
      </div>

      <div class="output-card">
        <h4>COO Verdict</h4>
        <p>${data.cooVerdict || "No verdict returned."}</p>
      </div>
    `;

  } catch(error){
    console.error("REAL ERROR:", error);

    output.innerHTML = `
      <div class="output-card">
        <h4>Real Error</h4>
        <p>${error.message}</p>
      </div>
    `;
  }
}

function clearOutput(){
  document.getElementById("problem").value = "";

  document.getElementById("output").innerHTML = `
    <div class="output-card">
      <h4>Your diagnosis will appear here.</h4>
      <p>Expected output: executive summary, root causes, SOP ideas, KPI suggestions, action plan, and outcomes.</p>
    </div>
  `;
}
</script>
