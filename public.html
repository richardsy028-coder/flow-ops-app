<script>
const API_URL = "/api/diagnose";

function list(items) {
  if (!Array.isArray(items) || items.length === 0) {
    return "<li>No data returned.</li>";
  }
  return items.map(item => `<li>${item}</li>`).join("");
}

async function runDiagnosis() {
  const industry = document.getElementById("industry").value;
  const problem = document.getElementById("problem").value.trim();
  const output = document.getElementById("output");

  if (problem.length < 20) {
    output.innerHTML = `
      <div class="error-card">
        <h3>Need More Detail</h3>
        <p>Please describe the operational problem in at least 20 characters.</p>
      </div>
    `;
    return;
  }

  output.innerHTML = `
    <div class="output-card">
      <h3>Analyzing...</h3>
      <p>⚡ FLOW is diagnosing ownership, workflows, SOPs, KPIs, and execution gaps.</p>
    </div>
  `;

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ industry, problem })
    });

    const data = await response.json();

    if (!response.ok || data.error) {
      throw new Error(data.error || "Backend request failed.");
    }

    output.innerHTML = `
      <div class="output-card">
        <h4>Executive Summary</h4>
        <p>${data.executiveSummary || "No summary returned."}</p>
      </div>

      <div class="output-card">
        <h4>Core Problem</h4>
        <p>${data.coreProblem || "No core problem returned."}</p>
      </div>

      <div class="output-card">
        <h4>Root Causes</h4>
        <ul>${list(data.rootCauses)}</ul>
      </div>

      <div class="output-card">
        <h4>Priority Actions</h4>
        <ul>${list(data.priorityActions)}</ul>
      </div>

      <div class="output-card">
        <h4>KPIs</h4>
        <ul>${list(data.kpis)}</ul>
      </div>

      <div class="output-card">
        <h4>Expected Outcome</h4>
        <p>${data.expectedOutcome || "No outcome returned."}</p>
      </div>

      <div class="output-card">
        <h4>COO Verdict</h4>
        <p>${data.cooVerdict || "No verdict returned."}</p>
      </div>
    `;

  } catch (error) {
    console.error("REAL ERROR:", error);

    output.innerHTML = `
      <div class="error-card">
        <h3>Request Error</h3>
        <p>${error.message}</p>
        <p style="opacity:.75;">Backend is working if curl returned 200. Make sure you opened http://localhost:3010/</p>
      </div>
    `;
  }
}
</script>
